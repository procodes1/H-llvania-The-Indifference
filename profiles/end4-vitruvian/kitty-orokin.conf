# Höllvania // Vitruvian Orokin terminal colors v0.1
# Loaded last through end-4's existing ~/.config/kitty/kitty.conf include:
# include $HOME/.config/kitty/custom.conf
# Keeps fonts, shells, keybindings, tabs and ML4W's old source files otherwise intact.

# Deep navy glass over the ivory-and-gold Orokin palace background.
background              #0B1120
foreground              #EEE5D3
background_opacity      0.87
dynamic_background_opacity yes
background_blur         14

# Ivory, gilded accents and cool Void-blue navigation.
cursor                  #D8B96F
cursor_text_color       #101828
selection_background    #344861
selection_foreground    #EEE5D3
url_color               #91B9E8
active_border_color     #D8B96F
inactive_border_color   #6B5A3D
bell_border_color       #E3C986

active_tab_background   #D8B96F
active_tab_foreground   #101828
inactive_tab_background #1C2638
inactive_tab_foreground #BDB59F
tab_bar_background      #0B1120

# 16 ANSI colors, with gold taking the yellow slot and Void-blue the blue slot.
color0  #101827
color1  #D98783
color2  #A6D3BF
color3  #D8B96F
color4  #91B9E8
color5  #B99BCD
color6  #83C3D1
color7  #D4CCBA
color8  #576781
color9  #F2A49C
color10 #C6EAD9
color11 #F4DEAC
color12 #BED7F4
color13 #E4C7EE
color14 #B6E7EC
color15 #EEE5D3
